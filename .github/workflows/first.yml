name: my-first-workflow
on: push

jobs:
  job1:
   name: JOB1
   runs-on: ubuntu-latest

   steps:
     - name: Running single command
       run: echo "Hello World!"

     - name: Checking OS Release
       run: cat /etc/os-release

  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest

    steps:
      - name: Check the system and kernel information
        run: uname -a

      - name: Run multiple commands
        run: |
          echo "Welcome to training"
          echo "The current date is `date`"
 
